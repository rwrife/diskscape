name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - refactor/**
      - docs/**
      - ci/**
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore diskscape.slnx

      - name: Build
        run: dotnet build diskscape.slnx -c Release --no-restore

      - name: Test DiskScape.Core
        run: dotnet test tests/DiskScape.Core.Tests/DiskScape.Core.Tests.csproj -c Release --no-build

  package-windows:
    if: github.event_name == 'push'
    needs: build-test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows 10 SDK (UWP packaging)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $installPath) {
            throw "Unable to determine Visual Studio installation path"
          }
          & $vsInstaller modify --installPath $installPath `
            --add Microsoft.VisualStudio.ComponentGroup.UWP.Support `
            --add Microsoft.VisualStudio.Component.Windows10SDK.19041 `
            --quiet --norestart --wait

      - name: Build release artifacts (portable zip + MSIX)
        shell: pwsh
        run: ./build/windows/package.ps1

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: artifacts/release/*
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package-windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts
          path: artifacts/release

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/diskscape-win-x64.zip
            artifacts/release/diskscape-win-x64.msix
